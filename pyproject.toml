[project]
name = "ecommerce-metrics-user-segmentation"
version = "1.0.0"
description = "SQL + Pandas e-commerce metric layer with data-quality checks, RFM segmentation and cross-validation"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
